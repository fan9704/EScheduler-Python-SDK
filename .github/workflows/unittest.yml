name: Auto Unittest

on:
  push:
    branches:
      - master
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read # 允許讀取 GHCR

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        run: uv sync

      - name: Pre-pull GHCR Image (Optional but recommended)
        run: docker pull ghcr.io/${{ github.repository_owner }}/your-image-name:latest

      - name: Run unittest with pytest
        env:
          DOCKER_HOST: unix:///var/run/docker.sock
          TEST_IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/your-image-name:latest
        run: |
          uv run pytest tests/unit -v -s
