name: E2E Testing (GHCR Testcontainers)

on:
  push:
    branches:
      - master
  pull_request:

jobs:
  e2e:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_KEY }}

      - name: Install dependencies
        run: uv sync

      - name: Pre-pull GHCR Image
        # 這裡建議手動拉一次，確保驗證通過且加速後面 Pytest 執行
        run: docker pull ghcr.io/${{ github.repository_owner }}/escheduler:latest

      - name: Run E2E tests
        env:
          DOCKER_HOST: unix:///var/run/docker.sock
          TEST_IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/escheduler:latest
        run: |
          uv run pytest tests/e2e -v -s